python = "3.12.3"

# The pinned MariaDB source tree this experiment extracts from. Pinned at
# <mariadb-source> (a byte-identical snapshot of
# <mariadb-source>, verified by tools/provenance.py)
# rather than the git checkout, so the developer's clean tree is never
# touched at all -- not even read for anything beyond the byte-comparison
# provenance.py itself does once, to record `identical`.
[source]
root = "<mariadb-source>"
version = "13.1.0"
maturity = "alpha"

# The labelled SQL corpus this experiment is measured against, mirrored by
# tools/corpus_mirror.py. `commit` is unchanged from the day the corpus
# was first mirrored, but it is no longer an unverifiable assertion: the
# mirror now runs on the local host, where this really is a grammar-corpus
# revision and every one of the 212 mirrored fixture blobs resolves under it
# (corpus/PROVENANCE.json records the per-file blob ids and
# `corpus_commit_verifiable_here`). `root` is the local checkout the mirror
# reads at that revision; `export_root` is the .git-less `git archive` export
# on the test host that the mirror used to copy from and that the measurement targets
# still see in their environment as <mdb-bison-ts-corpus>.
[corpus]
commit = "109403d6c3af9d937258994a9ccf153bc5aa5a3b"
root = "<grammar-corpus>"
export_root = "<mdb-bison-ts-corpus>"

