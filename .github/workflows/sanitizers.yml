name: MariaDB-LSP-Server-Sanitizers

# The build and tests of ci.yml with clang, AddressSanitizer (leaks too),
# UndefinedBehaviorSanitizer and the libFuzzer targets (-DWITH_FUZZERS=ON):
# the unit, CLI and end-to-end tests run under the sanitizers, and each fuzz
# target for a minute. The vcpkg ports and the MariaDB client library are
# still built with gcc, so their caches are those of ci.yml; the sanitizers
# do not need them instrumented.
#
# Like build-release.yml, it runs on a push to release/candidate; also by
# hand, on any branch.

on:
  push:
    branches: [ "release/candidate" ]
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'How long each fuzz target runs, in seconds'
        type: string
        required: false
        default: '60'

jobs:
  build:
    name: LSP-Server-Sanitizers
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: bld
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '60' }}

    steps:
      # ========================================
      # 0. CHECKOUT
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 1. TOOLS
      # ========================================
      # The cached directories, for the later steps (also the cache steps'
      # `path:`). Absolute and without '..': actions/cache refuses a path
      # with '.' or '..' in it, and then saves nothing.
      - name: Install Build Dependencies
        run: |
          CACHE_ROOT="$HOME/.cache/lsp-server-ci"
          {
            echo "CCACHE_DIR=$CACHE_ROOT/ccache"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$CACHE_ROOT/vcpkg-archives"
            echo "MARIADB_BOOTSTRAP_DIR=$CACHE_ROOT/mariadb-server-lsp"
          } >> "$GITHUB_ENV"
          mkdir -p "$CACHE_ROOT/ccache" "$CACHE_ROOT/vcpkg-archives"
          sudo apt-get update
          sudo apt-get install -y ninja-build bison ccache clang libclang-rt-dev
          cmake --version | head -1
          clang --version | head -1
          bison --version | head -1

      # ========================================
      # 2. CACHES
      # ========================================
      # Restored here, and each saved by a step of its own right after the
      # step that fills it, also when that or a later step fails, so what
      # was built is kept for the next run. (actions/cache saves only at the
      # end of a job that succeeded.)
      #
      # ccache and vcpkg's binary cache get a new entry every run, restored
      # from the newest one: their contents grow with every build.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-sanitizers-x64-linux-dynamic-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-sanitizers-x64-linux-dynamic-

      - name: Restore vcpkg binary cache
        id: vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-sanitizers
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-x64-linux-dynamic-

      # The server tree at the pin of libs/mariadbparser/UPSTREAM.md, with
      # its client targets built: one entry per pin.
      - name: Restore MariaDB server tree
        id: mariadb-server
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MARIADB_BOOTSTRAP_DIR }}
          key: mariadb-server-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('libs/mariadbparser/UPSTREAM.md') }}

      - name: Prime ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=2G
          # Per-run counters, so the summary describes this build only.
          ccache --zero-stats

      # ========================================
      # 3. CONFIGURE
      # ========================================
      - name: Configure
        id: configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_VCPKG_TRIPLET=x64-linux-dynamic \
            -DMARIADB_BOOTSTRAP_DIR="$MARIADB_BOOTSTRAP_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DWITH_FUZZERS=ON -DMDBLS_FUZZ_SECONDS="$FUZZ_SECONDS"

      # The vcpkg ports configure built (OpenSSL takes minutes), also those
      # of a configure that failed later; only when no entry of this
      # vcpkg.json was restored, since then nothing new was built.
      - name: Save vcpkg binary cache
        if: always() && !startsWith(steps.vcpkg.outputs.cache-matched-key, format('vcpkg-{0}-x64-linux-dynamic-{1}-', runner.os, hashFiles('vcpkg.json')))
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-sanitizers

      # Only a complete tree: its key does not change while the pin does
      # not, so a half-built one would be restored by every later run.
      - name: Save MariaDB server tree
        if: always() && steps.configure.outcome == 'success' && steps.mariadb-server.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MARIADB_BOOTSTRAP_DIR }}
          key: mariadb-server-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('libs/mariadbparser/UPSTREAM.md') }}

      # ========================================
      # 4. BUILD
      # ========================================
      # A job count, never a bare --parallel.
      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      # Reported even when the build failed; never fails the job.
      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats || true

      # The objects compiled so far, also by a build that failed.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-sanitizers-x64-linux-dynamic-${{ github.run_id }}

      # ========================================
      # 5. TESTS
      # ========================================
      # The unit tests (run_unit_tests), the CLI tests, the end-to-end tests
      # of the language server and the fuzz targets, all registered with
      # ctest, under the sanitizers.
      # ctest exits
      # non-zero when a test fails, which fails this step and the job; no
      # test registered at all is a failure too.
      - name: Run the tests
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error \
            --parallel "$(nproc)" --output-junit test-results.xml

      # ========================================
      # 6. ARCHIVE
      # ========================================
      # always(), so the results are there when a failure is what to look at.
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sanitizers
          # Also the inputs a fuzz target failed on.
          path: |
            ${{ env.BUILD_DIR }}/test-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 7
