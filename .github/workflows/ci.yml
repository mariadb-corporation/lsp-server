name: MariaDB-LSP-Server-CI

# Builds the language server and runs its tests, as MariaDB Shell's
# shell-ci.yml does for the shell: one Linux build (RelWithDebInfo,
# x64-linux-dynamic, ccache), then the tests; a failing test fails the job.
# It runs on the shell's self-hosted runner (the devtools-ci GCP VM, started
# by devtools-ci-start.yml), or on ubuntu-latest where that VM is not used.
# ccache, vcpkg's binary cache and the MariaDB server tree the client library
# is built from are kept with actions/cache, so a hosted run has them too.
#
# A pull request titled [bypass-ci] builds nothing; the job still reports.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      test:
        description: 'Run the tests'
        type: boolean
        required: false
        default: true

jobs:
  ensure-runner:
    # A [bypass-ci] pull request builds nothing: no need to start the VM.
    if: ${{ !contains(github.event.pull_request.title, '[bypass-ci]') }}
    uses: ./.github/workflows/devtools-ci-start.yml
    secrets: inherit

  build:
    name: LSP-Server-CI-Verification

    needs: ensure-runner

    # ensure-runner is skipped for a [bypass-ci] pull request and for a fork's
    # (which has no access to the GCP secrets); both still run this job. Only
    # a VM that failed to start stops it.
    if: ${{ always() && needs.ensure-runner.result != 'failure' && needs.ensure-runner.result != 'cancelled' }}

    # Both skipped cases go to a hosted runner: a job is assigned its runner
    # before any step's `if:` is evaluated, so 'self-hosted' would sit queued
    # for the VM nobody started until the 24h timeout.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || contains(github.event.pull_request.title, '[bypass-ci]')) && 'ubuntu-latest' || 'self-hosted' }}

    env:
      BUILD_DIR: bld
      # [bypass-ci] is the only thing that calls the build off.
      RUN_BUILD: ${{ !contains(github.event.pull_request.title, '[bypass-ci]') }}
      # A pull_request run has no inputs: it always tests. A manual run goes
      # by what it asked for.
      RUN_TESTS: ${{ !contains(github.event.pull_request.title, '[bypass-ci]')
        && (github.event_name == 'pull_request' || inputs.test) }}

    steps:
      - name: Skip CI Notice
        if: contains(github.event.pull_request.title, '[bypass-ci]')
        run: echo "Bypassing CI checks due to PR title tag."

      # ========================================
      # 0. CHECKOUT
      # ========================================
      - name: Checkout
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@v4

      # ========================================
      # 1. TOOLS
      # ========================================
      # The cached directories, for the later steps (also the cache steps'
      # `path:`). Absolute and without '..': actions/cache refuses a path
      # with '.' or '..' in it, and then saves nothing.
      - name: Install Build Dependencies
        if: env.RUN_BUILD == 'true'
        run: |
          CACHE_ROOT="$HOME/.cache/ci/lsp-server"
          {
            echo "CCACHE_DIR=$CACHE_ROOT/ccache"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$CACHE_ROOT/vcpkg-archives"
            echo "MARIADB_BOOTSTRAP_DIR=$CACHE_ROOT/mariadb-server-lsp"
          } >> "$GITHUB_ENV"
          mkdir -p "$CACHE_ROOT/ccache" "$CACHE_ROOT/vcpkg-archives"
          sudo apt-get update
          sudo apt-get install -y ninja-build bison ccache
          cmake --version | head -1
          bison --version | head -1

      # ========================================
      # 2. CACHES
      # ========================================
      # Restored here, and each saved by a step of its own right after the
      # step that fills it, also when that or a later step fails, so what
      # was built is kept for the next run. (actions/cache saves only at the
      # end of a job that succeeded.)
      #
      # ccache and vcpkg's binary cache get a new entry every run, restored
      # from the newest one: their contents grow with every build.
      - name: Restore ccache
        if: env.RUN_BUILD == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-x64-linux-dynamic-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-x64-linux-dynamic-

      - name: Restore vcpkg binary cache
        if: env.RUN_BUILD == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-x64-linux-dynamic-

      # The server tree at the pin of libs/mariadbparser/UPSTREAM.md, with
      # its client targets built: one entry per pin.
      - name: Restore MariaDB server tree
        id: mariadb-server
        if: env.RUN_BUILD == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MARIADB_BOOTSTRAP_DIR }}
          key: mariadb-server-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('libs/mariadbparser/UPSTREAM.md') }}

      - name: Prime ccache
        if: env.RUN_BUILD == 'true'
        run: |
          set -euo pipefail
          ccache --set-config=max_size=2G
          # Per-run counters, so the summary describes this build only.
          ccache --zero-stats

      # The live-connection tests (tests/e2e Live_connection, the unit test
      # Secret_store.plaintext_helper) need a mariadbd and MariaDB Shell's
      # test-only mariadb-secret-store-plaintext, and skip without them. The
      # self-hosted runner keeps both in ~/.cache/ci: the server unpacked by the
      # shell's server-build.yml, the shell's package and the helper published
      # by its shell-ci-publish.yml. The helper goes into the unpacked
      # package's bin/, where its RPATH finds the package's libraries. Missing
      # pieces are a warning, not a failure: those tests then skip, as on a
      # hosted runner.
      - name: Use the runner's MariaDB server and shell
        if: env.RUN_TESTS == 'true' && runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          shopt -s nullglob

          servers=(~/.cache/ci/mariadb*/bin)
          if [ ${#servers[@]} -eq 1 ]; then
            server=$(dirname "${servers[0]}")
            # mariadb-install-db is in scripts/ in a server tarball.
            echo "$server/bin" >> "$GITHUB_PATH"
            echo "$server/scripts" >> "$GITHUB_PATH"
            echo "MariaDB server: $server"
          else
            echo "::warning::Expected one ~/.cache/ci/mariadb*/bin, found ${#servers[@]}: live-connection tests will skip."
          fi

          tarballs=(~/.cache/ci/mariadb-shell*.tar.gz)
          helper=~/.cache/ci/shell-test-helpers/mariadb-secret-store-plaintext
          if [ ${#tarballs[@]} -eq 1 ] && [ -f "$helper" ]; then
            dest="$RUNNER_TEMP/mariadb-shell"
            rm -rf "$dest"
            mkdir -p "$dest"
            tar -xzf "${tarballs[0]}" -C "$dest"
            roots=("$dest"/*/)
            bin="${roots[0]%/}/bin"
            cp "$helper" "$bin/"
            echo "MDBLS_SHELL_BIN_DIR=$bin" >> "$GITHUB_ENV"
            echo "MariaDB Shell: $(basename "${tarballs[0]}"), helpers in $bin"
          else
            echo "::warning::Expected one ~/.cache/ci/mariadb-shell*.tar.gz (found ${#tarballs[@]}) and $helper: live-connection tests will skip."
          fi

      # ========================================
      # 3. CONFIGURE
      # ========================================
      # MDBLS_SHELL_BIN_DIR is baked in at configure: the unit tests get it as
      # a definition, the e2e tests through ctest's environment.
      - name: Configure
        id: configure
        if: env.RUN_BUILD == 'true'
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_VCPKG_TRIPLET=x64-linux-dynamic \
            -DMARIADB_BOOTSTRAP_DIR="$MARIADB_BOOTSTRAP_DIR" \
            ${MDBLS_SHELL_BIN_DIR:+-DMDBLS_SHELL_BIN_DIR="$MDBLS_SHELL_BIN_DIR"} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The vcpkg ports configure built (OpenSSL takes minutes), also those
      # of a configure that failed later.
      - name: Save vcpkg binary cache
        if: always() && env.RUN_BUILD == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # Only a complete tree: its key does not change while the pin does
      # not, so a half-built one would be restored by every later run.
      - name: Save MariaDB server tree
        if: always() && env.RUN_BUILD == 'true' && steps.configure.outcome == 'success' && steps.mariadb-server.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MARIADB_BOOTSTRAP_DIR }}
          key: mariadb-server-${{ runner.os }}-x64-linux-dynamic-${{ hashFiles('libs/mariadbparser/UPSTREAM.md') }}

      # ========================================
      # 4. BUILD
      # ========================================
      # A job count, never a bare --parallel.
      - name: Build
        if: env.RUN_BUILD == 'true'
        run: cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      # Reported even when the build failed; never fails the job.
      - name: Report ccache statistics
        if: always() && env.RUN_BUILD == 'true'
        run: ccache --show-stats || true

      # The objects compiled so far, also by a build that failed.
      - name: Save ccache
        if: always() && env.RUN_BUILD == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-x64-linux-dynamic-${{ github.run_id }}

      # ========================================
      # 5. TESTS
      # ========================================
      # The unit tests (run_unit_tests), the CLI tests and the end-to-end
      # tests of the language server, all registered with ctest. ctest exits
      # non-zero when a test fails, which fails this step and the job; no
      # test registered at all is a failure too.
      - name: Run the tests
        if: env.RUN_TESTS == 'true'
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error \
            --parallel "$(nproc)" --output-junit test-results.xml

      # ========================================
      # 6. ARCHIVE
      # ========================================
      # always(), so the results are there when a failure is what to look at.
      - name: Archive Test Results
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/test-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
