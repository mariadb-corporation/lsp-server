<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-labelledby="t d">
<title id="t">Open a 1 MB file → its syntax errors, over LSP</title>
<desc id="d">MariaDB LSP: 27 ms; postgres-language-server: 205 ms; SQL Tools Service (mssql): 1.3 s; squawk: 1.8 s; sql-language-server: no errors within 30 s; sqruff (lints only): not run: from 1 MB on it stops with one warning; sqls: no errors without a database</desc>
