<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-labelledby="t d">
<title id="t">Memory with a 10 MB file open, over LSP</title>
<desc id="d">MariaDB LSP: 40 MB; postgres-language-server: 359 MB; SQL Tools Service (mssql): 690 MB; sql-language-server: no errors within 30 s at 1 MB; squawk: no errors within 30 s; sqruff (lints only): not run: from 1 MB on it stops with one warning; sqls: killed at 100 KB (busy after 60 s)</desc>
<style>
