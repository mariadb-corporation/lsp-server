.surface{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9d9c95}
.grid{stroke:#2e2e2c}.axis{stroke:#4a4a46}.hl{fill:#3987e5}.ctx{fill:#76756d}
