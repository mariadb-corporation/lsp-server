.grid{stroke:#e6e5e1}.axis{stroke:#c9c8c2}.hl{fill:#2a78d6}.ctx{fill:#84837a}
.halo{stroke:#fcfcfb;stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
